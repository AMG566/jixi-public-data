name: Dividend data update

# 自动数据管道：A 股分红回填 → 全量门禁 → 通过后自动发布。
# 脚本来自私有主仓库 AMG566/Jixi 的 data-tools/（只读 PAT 拉取，单一数据源）。
# 安全设计：门禁不通过则退出非零、不推送；无新事件则不产生空版本提交。

on:
  workflow_dispatch:
    inputs:
      force_full_gate:
        description: "即使没有新事件也跑完整门禁（日常再复核，不发布）"
        type: boolean
        default: false
  schedule:
    # 每周二、六 16:00（北京时间）= 08:00 UTC；避开每日 v1 bot 的 00:39 UTC 发布
    - cron: "0 8 * * 2,6"

# 同一时间只允许一个数据更新任务，避免重叠抓取与推送冲突
concurrency:
  group: dividend-data-update
  cancel-in-progress: false

# GITHUB_TOKEN 需要写权限才能推回本仓库（公开仓库 Actions 免费且不限时长）
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # 脚本位于私有主仓库，运行时复制到本仓库；显式指定数据快照根目录。
    env:
      JIXI_PUBLIC_DATA_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout public data repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout app repo for data-tools scripts
        uses: actions/checkout@v4
        with:
          repository: AMG566/Jixi
          path: app-repo
          token: ${{ secrets.JIXI_APP_REPO_PAT }}

      - name: Stage scripts next to data snapshot
        run: |
          mkdir -p data-tools
          cp app-repo/data-tools/backfill_recent_dividends.py data-tools/
          cp app-repo/data-tools/backfill_etf_dividends.py data-tools/
          cp app-repo/data-tools/cross_validate_published_data.py data-tools/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # 先干跑，避免无新事件时 --apply 仍改写 manifest 为草稿、产生假版本。
      - name: Check for new stock dividends
        id: stock_changes
        run: |
          python3 data-tools/backfill_recent_dividends.py
          NEW=$(python3 -c "import json; print(json.load(open('data-tools/recent_backfill_report.json'))['events_added'])")
          echo "count=$NEW" >> "$GITHUB_OUTPUT"
          echo "股票新事件：$NEW"

      - name: Check for new ETF distributions
        id: etf_changes
        run: |
          python3 data-tools/backfill_etf_dividends.py
          NEW=$(python3 -c "import json; print(json.load(open('data-tools/recent_etf_backfill_report.json'))['events_added'])")
          echo "count=$NEW" >> "$GITHUB_OUTPUT"
          echo "ETF 新事件：$NEW"

      - name: Apply new stock dividends (draft)
        if: steps.stock_changes.outputs.count != '0'
        run: python3 data-tools/backfill_recent_dividends.py --apply

      - name: Apply new ETF distributions (draft)
        if: steps.etf_changes.outputs.count != '0'
        run: python3 data-tools/backfill_etf_dividends.py --apply

      - name: Detect new events
        id: new_events
        run: |
          if [ "${{ steps.stock_changes.outputs.count }}" != "0" ] || [ "${{ steps.etf_changes.outputs.count }}" != "0" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "🆕 检测到新分红事件"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 无新分红事件"
          fi

      - name: Cross-validate and release gate
        if: steps.new_events.outputs.new == 'true' || inputs.force_full_gate == true
        run: python3 data-tools/cross_validate_published_data.py

      # 门禁报告留档：失败时无需翻 2 小时日志，直接下载 JSON 看未通过资产与原因。
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-validation-report
          path: data-tools/cross_validation_report.json
          if-no-files-found: ignore

      - name: Commit and publish
        if: steps.new_events.outputs.new == 'true'
        run: |
          git config user.name "jixi-data-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events docs/manifest/v2.json docs/audit/latest.json
          VERSION=$(python3 -c "import json;print(json.load(open('docs/manifest/v2.json'))['data_version'])")
          git commit -m "data: ${VERSION} - auto dividend update (stock + ETF; backfill + gate)"
          # 运行期间可能有其他提交（如 v1 bot），rebase 后再推
          git pull --rebase origin main
          git push origin main

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.new_events.outputs.new }}" = "true" ]; then
            echo "✅ 新事件已通过门禁并发布（如上一步成功）"
          else
            echo "ℹ️ 本轮无新事件，未发布新版本"
          fi
